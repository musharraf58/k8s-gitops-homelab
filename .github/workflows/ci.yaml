name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  helm-lint:
    name: Lint Helm Charts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint nginx-app chart
        run: helm lint charts/nginx-app

      - name: Lint postgres-app chart
        run: helm lint charts/postgres-app
        continue-on-error: true  # postgres chart comes in next step

  terraform-validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: Terraform Init
        run: tofu init
        working-directory: terraform

      - name: Terraform Validate
        run: tofu validate
        working-directory: terraform
